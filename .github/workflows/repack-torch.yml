name: repack-torch

on:
  workflow_dispatch:
    inputs:
      version:
        description: "torch version (e.g. 2.8.0)"
        default: "2.8.0"
      flavour:
        description: "CUDA flavour (e.g. cu128)"
        default: "cu128"
      python:
        description: "python minor (e.g. 3.12)"
        default: "3.12"
      platform:
        description: "conda subdir"
        default: "linux-64"

permissions:
  contents: write
  actions: write

concurrency:
  group: repack-${{ inputs.version }}-${{ inputs.flavour }}-${{ inputs.python }}-${{ inputs.platform }}

jobs:
  repack:
    # ubuntu-24.04 images dropped python <= 3.9; 22.04 still carries them
    runs-on: ${{ contains(fromJSON('["3.8", "3.9"]'), inputs.python) && 'ubuntu-22.04' || 'ubuntu-latest' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python }}
          # 3.15 is RC-only until October: .pyc magic is already frozen at RC
          allow-prereleases: true

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q patchelf zstd
          pip install zstandard distlib

      - name: Repack
        run: |
          python tools/torch_repack.py \
            --version "${{ inputs.version }}" \
            --flavour "${{ inputs.flavour }}" \
            --python "${{ inputs.python }}" \
            --subdir "${{ inputs.platform }}" \
            -o dist --work work --delete-wheel
          rm -rf work
          ls -la dist/

      - name: Upload to release (immutable — never overwrite an asset)
        run: |
          gh release create "${{ inputs.platform }}" \
            --title "${{ inputs.platform }} packages" \
            --notes "Storage release for ${{ inputs.platform }} subdir packages. Do not delete: repodata base_url points here." \
            || true
          existing=$(gh release view "${{ inputs.platform }}" --json assets -q '.assets[].name')
          for f in dist/*.conda; do
            b=$(basename "$f")
            if echo "$existing" | grep -qxF "$b"; then
              if [ -f "meta/${{ inputs.platform }}/$b.json" ]; then
                echo "SKIP already-published $b (published artifacts are immutable)"
                rm "$f"
              else
                # a previous run uploaded the asset but died before committing
                # its fragment: fragment the PUBLISHED bytes, not this rebuild
                echo "asset $b exists but has no fragment; downloading published bytes"
                gh release download "${{ inputs.platform }}" --pattern "$b" --output "$f" --clobber
              fi
            else
              gh release upload "${{ inputs.platform }}" "$f"
            fi
          done

      - name: Commit repodata fragments
        run: |
          for f in dist/*.conda; do
            [ -e "$f" ] || continue
            python3 tools/fragment.py "$f" "${{ inputs.platform }}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta
          git diff --cached --quiet && { echo "no new fragments"; exit 0; }
          git commit -m "Add fragments: torch ${{ inputs.version }} ${{ inputs.flavour }} py${{ inputs.python }} ${{ inputs.platform }}"
          for i in 1 2 3; do
            git push origin main && break
            git pull --rebase origin main
          done

      - name: Trigger channel publish
        # pushes made with GITHUB_TOKEN do not fire push-triggered workflows
        run: gh workflow run publish-channel.yml --ref main
