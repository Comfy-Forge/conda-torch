name: repack-torch

on:
  workflow_dispatch:
    inputs:
      version:
        description: "torch version (e.g. 2.8.0)"
        default: "2.8.0"
      flavour:
        description: "CUDA flavour (e.g. cu128)"
        default: "cu128"
      python:
        description: "python minor (e.g. 3.12)"
        default: "3.12"
      platform:
        description: "conda subdir"
        default: "linux-64"
      build_number:
        description: "build number (bump to republish an entry with fixed metadata)"
        default: "0"
      side_build_number:
        description: "build number for shared side artifacts (nvshmem/cudnn/triton)"
        default: "0"

permissions:
  contents: write
  actions: write
  id-token: write
  attestations: write

concurrency:
  group: repack-${{ inputs.version }}-${{ inputs.flavour }}-${{ inputs.python }}-${{ inputs.platform }}

jobs:
  repack:
    # ubuntu-24.04 images dropped python <= 3.9; 22.04 still carries them
    runs-on: ${{ contains(fromJSON('["3.8", "3.9"]'), inputs.python) && 'ubuntu-22.04' || 'ubuntu-latest' }}
    env:
      GH_TOKEN: ${{ github.token }}
      # workflow_dispatch inputs are routed through env so they reach the
      # shell as real environment variables. A raw ${{ inputs.x }} inside a
      # run: block is substituted as TEXT before bash parses the line, so an
      # input containing `"; ...; y="` breaks out of any quoting and executes
      # (CWE-78). Never reference inputs.* directly inside run: below.
      IN_VERSION: ${{ inputs.version }}
      IN_FLAVOUR: ${{ inputs.flavour }}
      IN_PYTHON: ${{ inputs.python }}
      IN_PLATFORM: ${{ inputs.platform }}
      IN_BUILD_NUMBER: ${{ inputs.build_number }}
      IN_SIDE_BUILD_NUMBER: ${{ inputs.side_build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python }}
          # 3.15 is RC-only until October: .pyc magic is already frozen at RC
          allow-prereleases: true

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q patchelf zstd binutils
          # no version pin: setuptools 80+ dropped python 3.8, and the win
          # launcher extraction (torch_repack.py) falls back to downloading
          # setuptools 80.9.0's wheel directly when the local install lacks
          # cli-64.exe, so any locally installed setuptools is sufficient here
          pip install zstandard pefile setuptools

      - name: Install rattler-build
        env:
          RB_VERSION: "0.75.0"
          RB_SHA256: "0eb3d0cc3ad93c2add7aa50af533aae1a5b9a884e51325e4926db829649e3891"
        run: |
          set -euo pipefail
          url="https://github.com/prefix-dev/rattler-build/releases/download/v${RB_VERSION}/rattler-build-x86_64-unknown-linux-musl"
          curl -sSfL "$url" -o /usr/local/bin/rattler-build
          echo "${RB_SHA256}  /usr/local/bin/rattler-build" | sha256sum -c -
          chmod +x /usr/local/bin/rattler-build
          rattler-build --version

      - name: Render recipes
        # The recipe cannot be written by hand: depends come out of the
        # extracted wheel's METADATA, a live conda-forge satisfiability check
        # and an ELF/DLL audit. render_recipe.py runs the surgery once to
        # learn them, then emits a recipe whose `source: sha256` makes the
        # wheel check structural instead of bolted on.
        run: |
          set -euo pipefail
          python tools/render_recipe.py \
            --version "$IN_VERSION" \
            --flavour "$IN_FLAVOUR" \
            --python "$IN_PYTHON" \
            --subdir "$IN_PLATFORM" \
            --build-number "$IN_BUILD_NUMBER" \
            --side-build-number "$IN_SIDE_BUILD_NUMBER" \
            --out recipe --work work
          # The renderer's staged tree and its copy of the wheel are dead once
          # the recipe exists -- rattler-build does its own verified download.
          # Keep only the metadata the build step reads; runner disk is tight
          # and a torch wheel is measured in gigabytes.
          mv work/meta.json meta.json.keep
          rm -rf work && mkdir work && mv meta.json.keep work/meta.json
          df -h /

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          # Shared side artifacts (nvshmem/cudnn/triton) build from their own
          # recipes: each has a different verified source than the torch
          # recipe, and they are immutable at SIDE_BUILD across many cells.
          python -c "import json; [print(json.dumps(r)) for r in json.load(open('work/meta.json'))['side_requests']]" > side_requests.jsonl
          mapfile -t reqs < side_requests.jsonl
          for i in "${!reqs[@]}"; do
            # --skip-published writes no recipe when the shared artifact is
            # already published WITH a fragment: it is immutable, so a wave
            # rebuilding it can only burn time.
            python tools/render_side_recipe.py \
              --request "${reqs[$i]}" \
              --side-build-number "$IN_SIDE_BUILD_NUMBER" \
              --skip-published \
              --out "side_recipe_$i" --work "side_work_$i"
            rm -rf "side_work_$i"   # recipe is self-contained; free the wheel
            if [ -f "side_recipe_$i/recipe.yaml" ]; then
              rattler-build build \
                --recipe "side_recipe_$i/recipe.yaml" \
                --target-platform "$IN_PLATFORM" \
                --output-dir out -c conda-forge -c conda-forge/label/python_rc --no-build-id
            fi
          done
          # The libtorch half is shared across every shim of a cell, so on a
          # shim run both halves can already be published. Rebuilding then
          # produces bytes the upload step would throw away anyway (patchelf
          # padding is not reproducible), so skip the build outright.
          stems=$(python -c "import json; m = json.load(open('work/meta.json')); print(' '.join(f\"{m[k]['index']['name']}-{m[k]['index']['version']}-{m[k]['index']['build']}\" for k in ('libtorch', 'pytorch')))")
          assets=$(gh release view "$IN_PLATFORM" --json assets -q '.assets[].name' || true)
          need=0
          for st in $stems; do
            if [ -f "meta/$IN_PLATFORM/$st.conda.json" ] && echo "$assets" | grep -qxF "$st.conda"; then
              echo "SKIP $st: already published with fragment"
            else
              need=1
            fi
          done
          if [ "$need" = 1 ]; then
            rattler-build build \
              --recipe recipe/recipe.yaml \
              --target-platform "$IN_PLATFORM" \
              --output-dir out -c conda-forge -c conda-forge/label/python_rc --no-build-id
          else
            echo "both halves already published; nothing to build"
          fi
          shopt -s nullglob
          for f in out/*/*.conda; do mv "$f" dist/; done
          rm -rf out work recipe side_recipe_*
          ls -la dist/

      - name: Structural verification (RPATH lint, licenses, run_exports, .pyc)
        run: |
          shopt -s nullglob
          files=(dist/*.conda)
          [ ${#files[@]} -eq 0 ] || python3 tools/verify_repack.py "${files[@]}"

      - name: Attest build provenance
        # signed SLSA provenance for every artifact; continue-on-error so an
        # org-level feature gap can never block a publish
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/*.conda"

      - name: Hand the built artifacts to the gate and the publisher
        # Publishing is a separate job so that, on win-64, a clean-environment
        # import on a real Windows runner sits between "built" and
        # "published". dist/ may legitimately be empty (both halves already
        # published by sibling runs); the marker keeps the artifact creatable.
        run: touch dist/.built
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.run_id }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  win-gate:
    # THE win-64 gate: every win-64 repack must import in a clean environment
    # and every DLL import under torch/lib must resolve, on a stock Windows
    # runner, BEFORE the artifact is published. The repack itself runs on
    # linux (wheel surgery, no execution), so nothing before this step has
    # ever loaded the DLLs it ships. Same shape as cuda-foundry's
    # clean-environment test. Not gated on the live channel deploying: the
    # just-built files are served from a file:// channel, and a shim run
    # (libtorch already published by the donor) pulls libtorch straight
    # from the release asset rather than waiting for Pages.
    needs: repack
    if: inputs.platform == 'win-64'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      IN_VERSION: ${{ inputs.version }}
      IN_FLAVOUR: ${{ inputs.flavour }}
      IN_PYTHON: ${{ inputs.python }}
      IN_PLATFORM: ${{ inputs.platform }}
      IN_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.run_id }}
          path: ${{ runner.temp }}/dist
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.79.0
          run-install: false
      - name: Local channel from the built artifacts (+ the published libtorch on shim runs)
        shell: bash
        run: |
          set -euo pipefail
          pip install -q zstandard
          shopt -s nullglob
          cd "$RUNNER_TEMP/dist"
          if ! ls libtorch-*.conda >/dev/null 2>&1; then
            # shim run: the donor published libtorch at this build number
            # already; take the release asset, not whatever Pages serves yet
            gh release download "$IN_PLATFORM" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "libtorch-${IN_VERSION}-cuda${IN_FLAVOUR#cu}_repack_h*_${IN_BUILD_NUMBER}.conda" \
              --dir "$RUNNER_TEMP/dist"
          fi
          if ! ls pytorch-*.conda >/dev/null 2>&1; then
            gh release download "$IN_PLATFORM" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "pytorch-${IN_VERSION}-cuda${IN_FLAVOUR#cu}_repack_py${IN_PYTHON/./}_h*_${IN_BUILD_NUMBER}.conda" \
              --dir "$RUNNER_TEMP/dist"
          fi
          ls -la
          python "$GITHUB_WORKSPACE/tools/local_channel.py" --subdir "$IN_PLATFORM" \
            --out "$RUNNER_TEMP/localchan" *.conda
      - name: Clean-environment gate (solve, resolve every DLL import, import torch)
        shell: bash
        run: |
          set -euo pipefail
          cuda="${IN_FLAVOUR#cu}"; cuda="${cuda%?}.${cuda: -1}"     # cu128 -> 12.8
          chan="$(python -c "import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve().as_uri())" "$RUNNER_TEMP/localchan")"
          python tools/win_gate.py --workdir "$RUNNER_TEMP/gate" \
            --python "$IN_PYTHON" --cuda "$cuda" \
            --spec "pytorch ==$IN_VERSION cuda${IN_FLAVOUR#cu}_repack_py${IN_PYTHON/./}_*" \
            --expect-build "$IN_BUILD_NUMBER" \
            -c "$chan" -c https://comfy-forge.github.io/conda-torch -c conda-forge
      - name: Keep the DLL resolution map
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dll-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/gate/dll-audit.json
          if-no-files-found: ignore
          retention-days: 14

  publish:
    # Runs for every platform; on win-64 only after the gate passed. A
    # skipped gate (linux platforms) is not a failure.
    needs: [repack, win-gate]
    if: >-
      always() && needs.repack.result == 'success'
      && (inputs.platform != 'win-64' || needs.win-gate.result == 'success')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      IN_VERSION: ${{ inputs.version }}
      IN_FLAVOUR: ${{ inputs.flavour }}
      IN_PYTHON: ${{ inputs.python }}
      IN_PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.run_id }}
          path: dist
      - name: Install zstd (fragment.py reads the info tarball with it)
        run: sudo apt-get install -y -q zstd
      - name: Upload to release (immutable — never overwrite an asset)
        run: |
          gh release create "$IN_PLATFORM" \
            --title "$IN_PLATFORM packages" \
            --notes "Storage release for $IN_PLATFORM subdir packages. Do not delete: repodata base_url points here." \
            || true
          existing=$(gh release view "$IN_PLATFORM" --json assets -q '.assets[].name')
          for f in dist/*.conda; do
            [ -e "$f" ] || continue  # empty dist: a sibling run published everything
            b=$(basename "$f")
            if echo "$existing" | grep -qxF "$b"; then
              if [ -f "meta/$IN_PLATFORM/$b.json" ]; then
                echo "SKIP already-published $b (published artifacts are immutable)"
                rm "$f"
              else
                # a previous run uploaded the asset but died before committing
                # its fragment: fragment the PUBLISHED bytes, not this rebuild
                echo "asset $b exists but has no fragment; downloading published bytes"
                gh release download "$IN_PLATFORM" --pattern "$b" --output "$f" --clobber
              fi
            elif ! gh release upload "$IN_PLATFORM" "$f"; then
              # check-then-upload race: a sibling run (shared libtorch across
              # shims) landed this asset between our listing and our upload.
              # Shared builds are not byte-reproducible, so NEVER fragment
              # our local copy for an asset someone else published — mirror
              # the pre-check branch exactly.
              sleep 5
              if gh release view "$IN_PLATFORM" --json assets -q '.assets[].name' | grep -qxF "$b"; then
                if [ -f "meta/$IN_PLATFORM/$b.json" ]; then
                  echo "RACE: $b published by a sibling meanwhile; dropping local copy"
                  rm "$f"
                else
                  echo "RACE: $b published by a sibling meanwhile; adopting published bytes"
                  gh release download "$IN_PLATFORM" --pattern "$b" --output "$f" --clobber
                fi
              else
                echo "upload of $b failed and the asset is still absent" >&2
                exit 1
              fi
            fi
          done

      - name: Commit repodata fragments
        run: |
          for f in dist/*.conda; do
            [ -e "$f" ] || continue
            python3 tools/fragment.py "$f" "$IN_PLATFORM"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta
          git diff --cached --quiet && { echo "no new fragments"; exit 0; }
          git commit -m "Add fragments: torch $IN_VERSION $IN_FLAVOUR py$IN_PYTHON $IN_PLATFORM"
          for i in 1 2 3 4 5 6 7 8; do
            git push origin main && break
            sleep $((RANDOM % 10))
            git pull --rebase origin main
          done

      - name: Trigger channel publish
        # pushes made with GITHUB_TOKEN do not fire push-triggered workflows
        run: gh workflow run publish-channel.yml --ref main
